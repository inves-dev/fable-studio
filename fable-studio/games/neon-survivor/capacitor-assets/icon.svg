<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <linearGradient id="nsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="nsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo cyberpunk -->
  <rect x="0" y="0" width="60" height="60" rx="10" ry="10" fill="#0a0a1a"/>

  <!-- Borda neon cyan -->
  <rect x="1.5" y="1.5" width="57" height="57" rx="9" ry="9"
        fill="none" stroke="#00f0ff" stroke-width="2"/>

  <!-- Letras NS com gradiente e glow -->
  <g filter="url(#nsGlow)" fill="url(#nsGrad)"
     font-family="Helvetica, Arial, sans-serif" font-weight="900"
     font-size="26" text-anchor="middle">
    <text x="19" y="40">N</text>
    <text x="41" y="40">S</text>
  </g>

  <!-- Acento magenta embaixo -->
  <line x1="14" y1="48" x2="46" y2="48" stroke="#ff2bd6" stroke-width="1.5"
        stroke-linecap="round"/>
</svg>

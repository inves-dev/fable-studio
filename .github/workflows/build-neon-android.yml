name: Build Neon Survivor APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fable-studio/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('fable-studio/games/neon-survivor/android/**/*.gradle*', 'fable-studio/games/neon-survivor/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install workspace dependencies
        working-directory: fable-studio
        run: npm ci

      - name: Build web bundle (Vite)
        working-directory: fable-studio
        run: npm run build:neon

      - name: Add Android platform
        working-directory: fable-studio/games/neon-survivor
        run: npx --yes cap add android

      - name: Sync web assets to Android
        working-directory: fable-studio/games/neon-survivor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: fable-studio/games/neon-survivor/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK contents
        working-directory: fable-studio/games/neon-survivor/android
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ls -la "$APK"
          unzip -l "$APK" | grep -E "assets/public/(index\.html|assets/)" | head -10

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-survivor-debug-apk
          path: fable-studio/games/neon-survivor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14